# Compila o APK no runner do GitHub, não nos servidores da Expo.
#
# O `eas build --local` usa a mesma receita da nuvem, mas roda aqui — então não
# consome a cota de builds do plano free. Windows não é suportado pelo plugin
# local; Ubuntu é, e é o que o runner dá. Repositório público tem minutos
# ilimitados, então isto é gratuito e sem fila.
#
# O keystore de release continua vindo da conta da Expo, buscado pelo EXPO_TOKEN
# — é o que garante que o APK instale por cima do que está no celular, sem
# desinstalar nada.
#
# Um segredo a configurar: EXPO_TOKEN, criado em
# https://expo.dev/settings/access-tokens
name: APK Android

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: Perfil do eas.json (apk gera .apk, production gera .aab)
        default: apk
        type: choice
        options: [apk, production]
      arquiteturas:
        description: ABIs a compilar — arm64 sozinho corta o tempo em três quartos
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, "armeabi-v7a,arm64-v8a,x86,x86_64"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # O NDK vem explícito porque reanimated, screens e worklets compilam
      # código nativo, e o runner não traz NDK por padrão.
      - name: NDK
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - run: npm ci

      # O `gradle.properties` do HOME vence o do projeto na precedência do
      # Gradle — e é o único que sobrevive ao `expo prebuild`, que reescreve o
      # de `android/` a cada build. Daí os limites virem por aqui.
      #
      # O teto que o template do Expo escreve (-Xmx2048m, metaspace 512m) não
      # aguenta o KSP: o daemon do Kotlin estoura o METASPACE processando
      # expo-updates, e o build morre depois de meia hora de trabalho. Os
      # workers da EAS levantam esse teto; o runner do GitHub, não.
      #
      # As ABIs são a outra metade da conta. Compilar quatro arquiteturas
      # significa quatro passagens de CMake em reanimated, screens e worklets.
      # Celular moderno é arm64 — as outras três são tempo jogado fora.
      - name: Limites do Gradle
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=3"
            echo "reactNativeArchitectures=${{ inputs.arquiteturas }}"
          } >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      # Segunda execução em diante aproveita o que já foi baixado e compilado.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-

      # A extensão é obrigatória, não cosmética: arquivo sem `.apk` o Android
      # não abre para instalar, e o artefato do Actions preserva o nome que sai
      # daqui. O perfil `apk` gera pacote instalável; `production`, bundle de
      # loja.
      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          EXT=apk
          if [ "${{ inputs.perfil }}" = "production" ]; then EXT=aab; fi
          VERSAO=$(node -e "console.log(require('./app.json').expo.version)")
          npx eas-cli@latest build \
            --platform android \
            --profile ${{ inputs.perfil }} \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/impeto-$VERSAO.$EXT"

      - uses: actions/upload-artifact@v4
        with:
          name: impeto-${{ inputs.perfil }}
          path: |
            impeto-*.apk
            impeto-*.aab
          if-no-files-found: error
          retention-days: 30
